[project]
name = "cooker"
version = "0.1.0"
description = "Always-on background intelligence sidecar for the home network. Polite: interactive work always wins."
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pyyaml>=6.0",
]

[project.scripts]
cooker = "cooker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cooker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A test asserting on a file it just wrote has no event loop to keep polite, and
# wrapping every Path read in to_thread would obscure the assertion it is there
# to make. The rule matters in src/, where a blocked loop is a missed preemption.
"tests/*" = ["ASYNC240"]
# The frozen M1/M2 probes: they answered their question (DISCOVERY.md §A–§E) and
# their output is the record. Style-only violations (semicolons, `l` as a
# variable, imports mid-file) sit in code nobody will extend, so linting them
# buys a diff and nothing else. bench8 and any new bench stay linted.
"bench/bench2_decode.py" = ["E501", "E702", "E741", "F841", "SIM115"]
"bench/bench4_thinking.py" = ["E702", "E741", "SIM115"]
"bench/bench5_prefill.py" = ["E702", "E741", "SIM115", "B023", "F841"]
"bench/bench_disconnect.py" = ["E402", "E501", "E702", "E741", "F841", "SIM115"]
ignore = ["E501"]
