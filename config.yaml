# Cooker — configuration of record.
# Every value here is deliberately conservative. Make it fast later, not now.

daemon:
  bind_host: 127.0.0.1          # tailnet reaches it through Traefik, never bind 0.0.0.0
  port: 8256                    # registered in ~/HOMELAB-SERVICE-MAP.md
  launchd_label: com.homelab.cooker   # M8; doctor checks ~/Library/LaunchAgents/<label>.plist
  data_dir: var               # relative to repo root unless absolute
  log_level: INFO

# ---------------------------------------------------------------------------
# Politeness: the whole point. Interactive work on this box must not feel it.
# ---------------------------------------------------------------------------
detect:
  interval_seconds: 1.0
  # lsof watches the raw socket; this is a SEPARATE concern from how we
  # connect (inference.base_url). omlx listens on :8000 on every interface.
  omlx_port: 8000
  omlx_proc_names: [omlx, omlx-server]
  # Per-signal cadence. Set from measurement, not guess (DISCOVERY.md / the
  # cost table in detect.py): lsof costs ~190ms of CPU per call, so the socket
  # probe is ONE combined LISTEN+ESTABLISHED query per second and the rest ride
  # slower cadences. `fs` is a 4ms in-process stat scan, so it is cheap here.
  cadence_seconds:
    # 2s, not 1s: since bench #7 the sockets probe names the peers and the wire
    # decides whether they are generating, so a half-second of staleness in the
    # address book costs nothing. At 1 Hz this single probe cost 23% of a core on
    # a 28-core Studio, which is not "polite" for a sidecar watching nothing happen.
    sockets: 2.0
    hid: 2.0
    wal: 2.0
    oc_socks: 5.0
    fs: 5.0
    side: 5.0
    load: 5.0
    # Reading the wire is a dict lookup: the cost is paid once, by the resident
    # nettop, so this rides the tick cadence rather than a slow lane.
    wire: 1.0
    # The ledger poll is a real GET, paid per poll; it beats the wire by a
    # second on "is anyone generating", which is the whole reason it exists.
    ledger: 1.0
  fs_roots:
    - ~/dev
    - ~/homelab
  llm_stats_file: ~/.omlx/stats.json
  # --- bytes are the proof of inference (cooker/wire.py, bench #7) ---------
  # A socket is a relationship; OpenCode and Traefik hold one open on :8000 for
  # hours at zero throughput, so `lsof ESTABLISHED` cannot be the trigger for
  # ACTIVE_INFER or this daemon would never cook. Throughput is. One resident
  # nettop samples per interval, and a peer counts as generating if it moved
  # bytes anywhere inside the window.
  # 2.0s poll period. Each poll is a short nettop that costs ~1.2s of wall time
  # (a second of it is nettop's own sleep) and a few ms of CPU. A new external
  # generation is therefore noticed within ~2s, which is polite enough given the
  # prefill ceiling already bounds what we can be doing when it arrives.
  wire_interval_seconds: 2.0
  wire_window_seconds: 3.0
  # Calibrated, not picked: measured silence is exactly 0 B/s and one real
  # streamed reply was 6,683 B/s, so 256 sits two orders below the traffic and
  # comfortably above keepalive noise. Too high and we cook over a generation;
  # too low and a stray ACK freezes the kitchen.
  infer_min_bps: 256
  # Amended 2026-10-07, owner's decision (Sam): "it should run when I'm using
  # the computer, just not when I'm hitting omlx via anything." Presence
  # evidence — HID, opencode WAL, fs, :4096 subscribers — is now annotation
  # only; the blockers are GPU traffic (ledger, then bytes when blind) and
  # blindness to it. The collision this accepts is measured (§16): +95ms
  # median TTFT, +350ms prefill race, inside the 750ms budget. Set true to
  # restore the M2-era manners.
  presence_blocks: false
  load_proc_names: [omlx, opencode]
  # Ordered URLs to try, best first. https/home.arpa beats raw IPs, which
  # beat loopback (occupied by a stray http.server on this host).
  base_url_candidates:
    - https://omlx.home.arpa/v1
    - http://192.168.1.20:8000/v1
    - http://127.0.0.1:8000/v1
  opencode_port: 4096
  opencode_wal: ~/.local/share/opencode/opencode.db-wal
  hid_idle_command_timeout_seconds: 2.0
  lsof_command_timeout_seconds: 2.0
  # A stage in flight is allowed to finish under ACTIVE_USER (work is not
  # thrown away), but never longer than this.
  max_stage_seconds: 180
  # How long the wire must be known quiet before ONE bounded stage may start.
  # 4s is measured, not picked (DISCOVERY §16): during a live agent session the
  # gaps between bursts run 2-5s with a median of 2.2s, so four seconds is already
  # past the typical next burst, and it is also the shortest interval this meter
  # can honestly report - a 3s window polled every 2s cannot have seen 2s.
  # Measured cost when it is wrong: +95ms median, +200ms into a live decode, +350ms
  # for a second large prefill, against a 750ms budget.
  claim_quiet_seconds: 4.0
  # --- the ledger: what omlx says about its own bus (§20, bench15) ----------
  # Bytes are honest about moving and silent about *why*. The server's admin
  # ledger answers why: `total_active_requests`/`idle_seconds` count inference
  # and nothing else — measured, while the /admin/api/stats metronome hammered
  # :8000 at 2/s (12.5 KB/s), the ledger sat at active=0 with idle_seconds
  # climbing, and one real 0.26s completion moved total_requests. So when the
  # ledger is up it is the judge and bytes are the tripwire; when it is blind
  # the bytes judge, unchanged, safety-first. Polling it is not load worth
  # fearing: one ~6 KB GET per second, 5–8 ms of the server's event loop —
  # the same traffic the dashboards already generate, but now *explained*.
  ledger:
    enabled: true
    url_candidates:                     # https/proxy first, raw tailnet next,
      - https://omlx.home.arpa        # never loopback: shadowed by the stray
      - http://100.122.197.81:8000   # http.server (§6, landmine 6)
    ca_file: ~/homelab/edge/step/certs/root_ca.crt
    admin_key_env: AR_OMLX_ADMIN_KEY  # env first, then api_key_file, like the
    admin_key_file: ~/dev/autoresearch-service/.env   # inference key ladder
    interval_seconds: 1.0              # poll cadence; the wire notices in ~2s,
                                       # the ledger in ~1s, which is the point
    request_timeout_seconds: 2.0
    stale_seconds: 4.0                # older than this => blind, bytes judge
    infer_margin_seconds: 5.0         # unexplained bytes + idle under this =>
                                      # a generation the live counters just missed
  user_idle_seconds: 120        # HID quieter than this => not ACTIVE_USER
  opencode_wal_seconds: 30      # WAL touched within this => ACTIVE_USER
  fs_activity_seconds: 60       # a file saved within this => ACTIVE_USER
  interactive_cooldown_seconds: 60   # quiet period after ACTIVE_INFER ends
  idle_confirm_seconds: 60      # must stay quiet this long before ramping up

scheduler:
  max_concurrency: 1            # Sam's throttled rollout: ramp 1 -> n when proven
  min_concurrency: 0
  tick_seconds: 1.0
  # Self-inflicted brake: if our own background p95 TTFT exceeds this, halve.
  latency_p95_ceiling_s: 4.0
  backoff_base_seconds: 30
  backoff_max_seconds: 3600
  max_attempts: 3

inference:
  # https://omlx.home.arpa is Traefik -> omlx's Tailscale IP. This is the
  # stable route: it survives a DHCP change and is immune to whatever happens
  # to be bound to 127.0.0.1:8000 on this host (there IS one: a stray
  # http.server in ~/dev/mm-visit-itinerary shadows loopback right now).
  base_url: https://omlx.home.arpa/v1
  ca_file: ~/homelab/edge/step/certs/root_ca.crt
  model: Qwen3.8-Flash-Next-oQ4e-mtp
  api_key_env: AR_LLM_API_KEY     # read from ~/dev/autoresearch-service/.env
  api_key_file: ~/dev/autoresearch-service/.env
  # Derived from the prefill ladder (bench #5). Prefill is atomic and
  # exclusive on omlx: 1000 tok => 1.8x idle TTFT, 2000 => 3.0x, 8000 => 14x.
  # Only <=1000-token prefills keep interactive latency under 3x idle.
  max_prefill_tokens_per_request: 1000
  max_tokens_floor: 512           # this model streams reasoning first; a small
                                  # budget buys finish_reason=length and no answer
  default_temperature: 0.7
  request_timeout_seconds: 300
  connect_timeout_seconds: 5
  # Mechanical stages do not need a chain of thought; make them cheap and fast.
  # Decode is preemptible and fair, so a generous output budget costs the box
  # nothing it cannot interrupt; it is the *prefill* ceiling that protects you.
  # One flat 512 for every stage meant a `synthesize` stage spent ~500 tokens
  # thinking and published an answer cut off mid-sentence with finish=length.
  stage_max_tokens:
    plan: 400
    extract: 700
    # Raised from 1400/900 on 2026-10-07 after live chains: `synthesize` returned
    # 2,185 completion tokens and still read as usable, while `critique` spent all
    # 900 on 4,364 characters of reasoning and published *no content* — the model
    # thinks before it answers, and a budget shorter than its thinking buys
    # finish_reason=length with nothing to score. These are output budgets, so the
    # interactive user is protected by the prefill ceiling above, not by these.
    synthesize: 2200
    critique: 1800
    evaluate: 320
    default: 512
  # The retry budget for a stage that exhausted its own. Capped, because "retry
  # with more" without a ceiling is how a stuck model spends the night.
  length_retry_max_tokens: 3000
  thinking_off_stages:
    # `plan` picks search queries. That is selection, not reasoning, and a chain
    # of thought here costs tokens to produce four lines of text.
    - plan
    - extract
    - scan
    - collect
    - consolidate
    - publish

search:
  searxng_url: https://searxng.home.arpa/search
  ca_file: ~/homelab/edge/step/certs/root_ca.crt
  timeout_seconds: 20
  max_results: 8
  fetch_max_bytes: 262144
  # Cap enforced *while streaming*, not after: resp.read() on a 200 MB page
  # allocates 200 MB before you get to say no, and an OOM kill runs no finally.
  cache_ttl_days: 7
  cache_max_mb: 256
  # Substring match against the fetched host. Noise we never want as a source.
  block_hosts:
    - youtube.com
    - facebook.com
    - x.com

delegate:
  autoresearch_url: https://autoresearch.home.arpa
  enabled: true

research:
  # Queries per subject. Each one is a SearXNG hit and a handful of fetches,
  # so this multiplies the noise you make on the internet, not just the cost.
  max_queries: 3
  # Sources that become extract stages. This is the GPU bill: N sources is N
  # prefills. 4 x ~800 tokens stays under the per-request ceiling with room.
  max_sources: 4
  # How much of one page a single extract may read. Chosen against the 1000
  # token prefill ceiling, not against readability.
  source_context_chars: 2400
  # How much of a draft the evaluator reads. Sized against the prefill ceiling:
  # system + ask + this must stay under `max_prefill_tokens_per_request`, because
  # a prompt that arrives at 1,001 tokens against a ceiling of 1,000 does not get
  # trimmed, it gets refused, and the chain stalls at the gate.
  evaluate_excerpt_chars: 2400

topics:
  file: topics.md
  # A fresh install with no topics.md still has somewhere to get its first
  # subject from, rather than quietly doing nothing forever and looking healthy.
  fallback:
    - local LLM inference scheduling on Apple Silicon
    - running a home Kubernetes cluster without becoming a second job

quality:
  publish_threshold: 3.5
  dedup_window_days: 14
  # Below this EMA, and only after this many rated artifacts, the generator is
  # parked and `claim_next` stops handing it work. The sample size is the point:
  # one grumpy morning must not switch a generator off permanently.
  feedback_ema_floor: 2.5
  feedback_park_after: 5
  # Manual parks (`cooker park <generator>`) are honoured alongside the EMA.
  park_parked_generators: true
  # A URL fetched inside this window is not fetched again: the cheapest politeness
  # there is toward an origin you have already read today.
  url_dedup_days: 7

safety:
  max_disk_gb: 2.0
  max_task_runtime_minutes: 20
  outputs_dir: outputs
  # git is only ever run through safety.git_readonly(); these are the only
  # subcommands it will accept. Anything else raises.
  git_readonly_subcommands:
    - status
    - diff
    - log
    - show
    - blame
    - ls-files
    - ls-tree
    - remote
    - rev-parse
    - shortlog
    - tag
    - describe

ui:
  sfx_default: off
  canvas_width: 480
  canvas_height: 270

generators:
  research:      { enabled: true,  weight: 3 }
  deep-dive:     { enabled: true,  weight: 1 }
  project-review: { enabled: true, weight: 2 }
  homelab-audit: { enabled: true,  weight: 1 }
  brainstorm:    { enabled: true,  weight: 2 }
  creation:      { enabled: true,  weight: 1 }
  digest:        { enabled: true,  weight: 1 }

# OpenCode as a tool (M9, 2026-10-07, owner's request): the deep-dive pot
# delegates to Sam's opencode server through its documented loopback API.
# Device facts (DISCOVERY §21): v2.0.24 launchd `com.homelab.opencode`,
# HTTP Basic on :4096, username always "opencode". The password is never in
# this file — it comes from OPENCODE_PASSWORD in the env or the edge stack's
# .env, resolved by the ladder in opencode.py.
opencode:
  enabled: true
  base_url: http://127.0.0.1:4096
  agent: build
  poll_seconds: 2.0
  max_minutes: 12
  # Permissions are answered one at a time. "always" is refused by the code
  # no matter what is set here, because a saved permission outlives the
  # stage that earned it.
  auto_permission: once
  form_default_answer: "Proceed read-only; keep outputs in the workspace."
  # deny beats auto_permission: research never legitimately needs these.
  # deny_patterns: []   # unset = the module's built-in list

# Where deep-dive delegations live when they build. The agent gets a
# freshly minted, guaranteed-empty directory here — its own project home,
# never a folder inside the cooker's var/outputs (the first "make its own
# thing" order built a git repo AND a 52 MB chezmoi sandbox in the freezer;
# that is why this knob exists and why mint refuses-if-exists).
deep_dive:
  projects_root: ~/dev/hobby

# Sam orders work at the counter (the Kitchen tab). Pending orders are capped
# so a burst of typing cannot fill the queue: 429 is honest, a silent drop is
# not.
orders:
  max_pending: 3
  # the owner writes lengthy orders; the ceiling is courtesy, not doubt.
  # the floor stays at 8 — a subject needs enough words to mean something.
  max_topic_chars: 20000
